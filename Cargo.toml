[package]
name = "myari"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"
bevy_pancam = "0.16"
fastnoise-lite = "1.1"
glam = "0.29"
hexx = { version = "0.19", default-features = false, features = ["serde"] }
rand = "0.8"
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# Speed up the noise-heavy generation passes when running unoptimized.
opt-level = 1

[profile.dev.package."*"]
# Keep upstream crates optimized so noise/hash inner loops are not crawling
# in debug builds.
opt-level = 3
